name: Construir APK de Licorería Claudia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          if [ -f licoreria_claudia_proyecto_android.zip ]; then
            unzip -o licoreria_claudia_proyecto_android.zip -d proyecto
          else
            echo "No se encontró el archivo licoreria_claudia_proyecto_android.zip"
            exit 1
          fi

      - name: Compilar aplicación
        working-directory: proyecto/licoreria_claudia_proyecto_android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Licoreria-Claudia-apk
          path: proyecto/licoreria_claudia_proyecto_android/app/build/outputs/apk/debug/app-debug.apk
